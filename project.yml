name: HearNow
options:
  bundleIdPrefix: pl.fastlink
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  HearNow:
    type: application
    platform: iOS
    sources:
      - path: HearNow
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: HearNow
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSMicrophoneUsageDescription: HearNow słucha otoczenia mikrofonem i od razu odtwarza dźwięk w Twoich słuchawkach. Nic nie jest nagrywane ani wysyłane.
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.fastlink.hearnow
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
